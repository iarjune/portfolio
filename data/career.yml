strategic_domains:
  - id: "cloud-transformation"
    title: "Cloud Transformation"
    subtitle: "Cloud migrations · Data center exits · Multi-account architecture · Infrastructure modernization"
    image: "cloud-transformation.jpg"
    case_studies:
      - id: "eks-migration"
        title: "Zero-Downtime AWS EKS Migration"
        problem: "Legacy data centers were reaching capacity, creating compute bottlenecks and deployment friction for 600+ microservices supporting sub-50ms ad serving."
        solution: "Spearheaded a zero-downtime migration to a multi-account AWS EKS architecture spanning 4 accounts (dev, stage, prod, mgmt). Leveraged GitOps, Argo CD, and Crossplane to migrate 1,500+ pipelines and 600+ microservices without interrupting real-time ad serving."
        metrics:
          - "600+ Microservices Migrated"
          - "1,500+ Pipelines Modernized"
          - "Zero Ad-Serving Downtime"
        architecture: |
          graph TD
            A[Legacy Datacenter Infra] -->|Zero-Downtime Sync| B(AWS Multi-Account EKS)
            B --> C[Dev Account]
            B --> D[Stage Account]
            B --> E[Prod Account]
            B --> F[Mgmt Account]
            F -->|GitOps Reconciliation| C & D & E
        deep_dive_sections:
          - title: "Multi-Account Isolation & Network Architecture"
            content: |
              • Implemented a strict multi-account AWS architecture separating management, development, staging, and production boundaries via AWS Organizations and Control Tower.
              • Configured isolated VPCs with private subnets, NAT gateways, and transit gateways to ensure low-latency peering and secure cross-account communication for high-throughput ad exchanges.
          - title: "Zero-Downtime Migration Strategy & Execution"
            content: |
              • Executed phased canary traffic shifting from bare-metal load balancers to AWS Application Load Balancers (ALB) and Envoy Gateways.
              • Maintained state synchronization between legacy on-premises databases and AWS-hosted managed data stores during the transition window to achieve zero packet loss and zero downtime.
        subsystems:
          - id: aws-multi-account-eks
            name: "AWS Multi-Account EKS Clusters"
            type: "Compute Platform"
            logoKey: "kubernetes"
            description: "Production-grade managed Kubernetes clusters distributed across isolated AWS accounts for workload segmentation."
            techStackLogos: ["kubernetes", "aws", "terraform"]
            components:
              - name: "Control Plane Isolation"
                spec: "Dedicated EKS control planes in management and production accounts with automated cluster bootstrapping via Argo CD."
              - name: "Node Group Autoscaling"
                spec: "Dynamic worker node provisioning using Karpenter and spot instance integration for optimal cost and performance."

          - id: envoy-gateway-routing
            name: "Envoy Gateway & Ingress Routing"
            type: "Networking & Edge"
            logoKey: "envoy"
            description: "High-performance edge routing and traffic management for sub-50ms ad serving endpoints."
            techStackLogos: ["envoy", "aws", "kubernetes"]
            components:
              - name: "Traffic Shifting"
                spec: "Managed zero-downtime canary routing from legacy bare-metal infrastructure to AWS EKS services."
              - name: "SSL Termination & Security"
                spec: "Centralized TLS termination and WAF policy enforcement at the AWS Edge."

      - id: "datacenter-decommissioning"
        title: "Full Datacenter Decommissioning & Hybrid Cloud Transition"
        problem: "Maintaining two legacy physical data centers with 200+ physical Dell hosts and 600+ KVM virtual instances incurred heavy recurring CapEx, OpEx and poor scalability."
        solution: "Orchestrated the complete end-to-end migration and hardware decommissioning of two physical data centers into a multi-region, multi-account AWS environment."
        metrics:
