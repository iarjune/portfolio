      - id: "public-workload-security"
        title: "Zero-Day Vulnerability Discovery and Alerting System"
        problem: "Limited visibility into the vulnerability posture of internet-facing Kubernetes applications made it difficult to continuously assess exposure and prioritize remediation."
        solution: "Designed and implemented an observability system to locate, report and alert teams concerning top priority vulnerabilities in internet-facing services in Kubernetes.  The cronjob scanner dynamically discovers internet-facing Ingress resources, correlates public endpoints with container images, and executes Snyk Container scans, exporting findings to Datadog."
        metrics:
          - "Scheduled Continuous Security Assessments"
          - "Dynamic Public Workload Discovery"
          - "Datadog Security Metrics Integration"
          - "Historical Vulnerability Trend Analysis"
          - "Team Based Security Alerting & Reporting" 
        architecture: |
          graph LR
            A[Kubernetes Cluster] --> B[Public Ingress Discovery]
            B --> C[Service / Deployment Correlation]
            C --> D[Container Image Discovery]
            D --> E[Snyk Container Scanning]
            E --> F[Vulnerability Aggregation]
            F --> G[JSON / CSV Reports]
            G --> H[Datadog Metrics Integration]
            H --> I[Security Dashboards]
            H --> J[Trend Analysis]
            H --> K[Alerting & Reporting]
        deep_dive_sections:
          - title: "Exposure-Aware Security Discovery"
            content: |
              • Developed automated discovery routines to identify internet-facing Kubernetes applications across namespaces by evaluating AWS ALB annotations and public IngressClass conventions.
              • Correlated exposed endpoints with backend Services, Deployments, and container images to establish accurate blast-radius maps.
          - title: "Containerized Scheduled Assessment"
            content: |
              Packaged the scanner as a containerized workload and deployed it as a Kubernetes CronJob. Established recurring security assessments without requiring manual execution or integration into individual application build pipelines. Implemented configurable parallel scanning to efficiently assess multiple application images within each execution cycle.
          - title: "Vulnerability Intelligence & Metrics Integration"
            content: |
              Integrated Snyk Container to assess discovered images against known vulnerability intelligence. Aggregated unique Critical, High, Medium, and Low findings and generated structured JSON output designed for ingestion into Datadog as metrics. Preserved application, image, and exposure context to support security analysis.
          - title: "Observability & Automated Alerting & Reporting"
            content: |
              • Exported structured vulnerability findings directly into Datadog as custom metrics, enabling real-time security dashboards, historical trend analysis, alerting and reporting..
              • Enabled security and engineering teams to monitor the vulnerability posture of publicly exposed workloads over time and identify applications requiring remediation.
