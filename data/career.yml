case_studies:
  - id: "eks-migration"
    title: "Zero-Downtime AWS EKS Migration"
    problem: "Legacy data centers were reaching capacity, creating compute bottlenecks and deployment friction for 600+ microservices."
    solution: "Spearheaded a zero-downtime migration to a multi-account AWS EKS architecture. Leveraged GitOps, Argo CD, and Crossplane to provide self-service environments, migrating 1,500+ pipelines without interrupting ad-serving."
    metrics:
      - "600+ Microservices"
      - "1,500+ Pipelines"
      - "Zero Downtime"
    architecture: |
      graph TD
        A[Legacy Datacenter] -->|Zero-Downtime Sync| B(AWS Multi-Account EKS)
        B --> C[Dev Account]
        B --> D[Stage Account]
        B --> E[Prod Account]
        B --> F[Mgmt Account]
        F -->|GitOps| C & D & E

  - id: "vespa-search"
    title: "Sub-50ms Vespa Cloud Vector Search"
    problem: "Real-time ad serving required extremely low latency (<50ms) hybrid search (Vector + BM25) across massive datasets."
    solution: "Deployed production Vespa Cloud search infrastructure. Optimized multi-phase tensor ranking and real-time streaming ingestion via Kafka, significantly improving query performance at high QPS."
    metrics:
      - "<50ms Latency"
      - "High QPS"
      - "Hybrid Search"
    architecture: |
      graph LR
        A[Kafka Streaming] --> B[Vespa Cloud]
        B --> C{Hybrid Search}
        C --> D[Vector Rank]
        C --> E[BM25 Rank]
        D & E --> F[Sub-50ms Response]

  - id: "idp-gitops"
    title: "Self-Service IDP & 100% ArgoCD GitOps"
    problem: "Engineers faced significant cognitive load and manual toil when provisioning cloud resources and pipelines."
    solution: "Created an Internal Developer Portal (IDP) with 'golden path' templates. Orchestrated a K8s-native, API-driven GitOps platform using the Argo suite, achieving 100% adoption and full developer autonomy."
    metrics:
      - "100+ Engineers"
      - "100% GitOps Adoption"
      - "Full Autonomy"
    architecture: |
      graph TD
        A[Developer] -->|IDP Portal| B(Golden Paths)
        B --> C[Git Repository]
        C -->|Trigger| D[Argo Events / Workflows]
        C -->|Sync| E[Argo CD]
        E --> F[EKS Cluster]

  - id: "finops-optimization"
    title: "FinOps & Cloud Spend Reduction"
    problem: "Cloud costs were spiraling due to rigid compute setups and inefficient resource allocation across data and ML operations."
    solution: "Implemented dynamic node autoscaling with Karpenter and HPA. Built automated Kubernetes resource inventory systems tagged to Kubecost, optimizing bin-packing and spot instances."
    metrics:
      - "50% Spend Reduction"
      - "$50k OpEx Savings"
      - "Dynamic Autoscaling"
    architecture: |
      graph TD
        A[EKS Cluster Workload] --> B{Karpenter / HPA}
        B -->|Scale Up| C[Spot Instances]
        B -->|Bin-Packing| D[Right-Sized Nodes]
        C & D --> E[Kubecost Monitoring]
        E --> F[50% Cost Reduction]

  - id: "mlops-ai-governance"
    title: "Automated MLOps Retraining & AI Governance Platform"
    problem: "Legacy MLOps pipelines (Hadoop Spark, Airflow) were slow and complex, and unmanaged AI developer tools posed data leak risks."
    solution: "Constructed modern event-driven MLOps pipelines using Kubeflow, MLflow, and Argo Workflows triggered by metric drift. Established centralized LLM proxy gateways with automated PII sanitization to safely roll out AI tools (Claude Code, Copilot, ChatGPT)."
    metrics:
      - "Automated Model Retraining"
      - "PII Sanitized AI Gateways"
      - "Legacy Hadoop Phase-out"
    architecture: |
      graph TD
        A[Metric Drift Event] --> B[Argo Events / Workflows]
        B --> C[Kubeflow & MLflow Pipeline]
        C --> D[Model Retraining & Validation]
        E[Developer AI Tools] --> F[Centralized LLM Proxy]
        F -->|PII Sanitization| G[External LLM Providers]

  - id: "devsecops-supply-chain"
    title: "DevSecOps Integration & Enterprise Compliance"
    problem: "Lack of automated security guardrails in build pipelines delayed deployments and risked compliance standards."
    solution: "Embedded Snyk, JFrog Xray, and SonarQube into CI/CD pipelines, automated SBOM generation, and implemented Open Policy Agent (OPA) K8s gatekeepers with Akeyless secrets injection. Authored documentation supporting SOC 2 certification."
    metrics:
      - "100% Pipeline Security Scans"
      - "Automated SBOM & Patching"
      - "SOC 2 Compliance Support"
    architecture: |
      graph LR
        A[Code Commit] --> B[GitHub Actions / Argo WF]
        B --> C[Snyk / SonarQube / Xray]
        B --> D[SBOM Generation]
        C & D --> E[OPA Gatekeeper & Akeyless Injection]
        E --> F[Secure EKS Deployment]

  - id: "global-private-cloud"
    title: "Global Private Cloud Architecture (AppNexus)"
    problem: "Rapid international growth required scaling big data infrastructure processing 170TB daily and 5M ETL transactions/sec."
    solution: "Engineered and expanded global private cloud infrastructure across 3 data centers in Europe and Asia, provisioning 200+ racks (10,000+ bare-metal Dell servers, 4,000+ Xen VMs) with automated PXE/Kickstart and Puppet deployment pipelines."
    metrics:
      - "10,000+ Physical Servers"
      - "170TB Ingestion Daily"
      - "200+ Racks Provisioned"
    architecture: |
      graph TD
        A[5M ETL Txns/sec] --> B[Global Data Centers - 3 Regions]
        B --> C[10k+ Dell Bare-Metal Servers]
        B --> D[4k+ Xen Virtual Instances]
        E[Automated PXE / Kickstart / Puppet] --> C & D

  - id: "datacenter-consolidation-aws"
    title: "Hybrid Data Center Build & AWS Migration (GRM)"
    problem: "Fragmented IT systems across 20+ national/international locations and acquired companies caused excessive operational overhead."
    solution: "Constructed a highly available VMware vSphere data center, consolidated 5 acquired IT departments, and migrated core database/web workloads to AWS (EC2, VPC, ELB). Reduced overall technology spend by 40%."
    metrics:
      - "40% Tech Spend Reduction"
      - "5 Acquired IT Depts Merged"
      - "60+ AWS Node Web Farm"
    architecture: |
      graph TD
        A[Distributed Locations / Acquired Depts] --> B[Consolidated On-Prem Data Center]
        B -->|VMware vSphere Cluster| C[Private Cloud]
        B -->|Cloud Migration| D[AWS EC2 / VPC / ELB Farm]
        D --> E[Cold DR Site in AWS]

experience:
  - company: "adMarketplace"
    location: "New York, NY"
    tenure: "Oct 2016 – May 2026"
    roles:
      - "Staff Platform & Infrastructure Engineer"
    image: "admarketplace.jpg"
    summary: "Led platform engineering, cloud transformation, zero-downtime datacenter decommissioning, and high-throughput infrastructure supporting ultra-low-latency ad serving."
    tags:
      - Leadership
      - AWS
      - Devops
      - CI/CD
      - Self Service IDP
      - FinOps
      - DevSecOps
      - DevEx
      - GitOps
      - Mem Cached DBs
      - SQL DBs
      - Kubernetes
      - Argo
      - IaC
      - Datadog
      - Databricks
      - Observability
      - PagerDuty
      - Datacenter Ops
      - Scrum Master

    achievements:
      - title: Platform Leadership, Engineering Scale & Governance
        story: Starting as one of two engineers managing the entire infrastructure footprint before post-COVID expansion, grew and led a cross-functional team of 15+ platform, DevOps, and infrastructure engineers. Managed end-to-end team hiring, career development, and engineering governance while bridging product requirements with hosting infrastructure. Acted as Scrum Master to align strategic planning, manage risk, and drive execution across teams, while serving on the Architecture Review Board (ARB) and engineering guilds. Spearheaded developer engagement through weekly open office hours, tech talks, and feedback loops directly integrated into developer portals, using DevEx metrics (build times, deployment frequency, MTTR) to continuously improve engineering velocity and software quality.

      - title: Multi-Account EKS Cloud Infrastructure & Progressive GitOps Platform
        story: Built and scaled the foundational AWS cloud infrastructure and Kubernetes (EKS) hosting environment from the ground up across a multi-account, multi-cluster architecture (dev, stage, prod, and mgmt). Architected a self-service, API-driven GitOps and CI/CD ecosystem using Argo CD, Argo Workflows, Argo Events, Argo Rollouts, and Kustomize. Standardized automated release engineering with progressive deployment strategies (canary/blue-green) and automated promotion gates across dev, stage, and prod environments, achieving 100% platform adoption across 100+ engineers with zero manual intervention.

      - title: Internal Developer Platform (IDP) & Golden Path Self-Service
        story: Centralized developer autonomy by constructing an Internal Developer Portal (IDP) backed by developer-managed Golden Path scaffolding templates, REST APIs, and Crossplane orchestration. Provided 100+ engineers with full self-service autonomy over environment provisioning, service onboarding, event-driven pipelines, and experimentation setups. This standardized scaffolding eliminated operational friction and cognitive overhead, allowing product teams to seamlessly onboard and manage microservices across all environments.

      - title: Bare-Metal Datacenter Operations & Network Modernization
        story: Managed multi-datacenter operations consisting of 200+ Dell physical hosts, 600+ KVM virtual instances, and Ceph/NAS storage arrays supporting stateful workloads. Spearheaded major physical network upgrades by swapping legacy Juniper Top-of-Rack (TOR) switches for high-performance Arista switches to optimize throughput and lower latency across on-prem infrastructure. Built automated bare-metal and VM provisioning engines using Puppet (Roles & Profiles/Hiera), The Foreman, and PXE/Kickstart workflows to streamline infrastructure lifecycle management prior to cloud-native adoption.

      - title: Full Datacenter Decommissioning & Zero-Downtime EKS Migration
        story: Orchestrated the zero-downtime end-to-end cloud migration of 600+ microservices from two legacy physical data centers into the multi-region, multi-account AWS EKS platform. Containerized all legacy workloads with Docker, defined multi-region infrastructure using Terraform, and established global edge-serving points of presence to enhance user-facing latency. Successfully executed the post-migration hardware decommissioning of both physical data centers with zero disruption to ad-serving pipelines.

      - title: CI/CD Pipeline Modernization, DevSecOps & Compliance
        story: Executed a full-scale CI/CD transformation by migrating 500+ repositories from Bitbucket Server to Bitbucket Cloud, and ultimately consolidating 900+ repositories onto GitHub Actions and Kubernetes-native Argo Workflows. Replaced legacy Jenkins/Ansible build systems with containerized pipelines and custom Python libraries. Integrated Snyk, JFrog Artifactory, SonarQube/SonarCloud, and Akeyless (HashiCorp Vault) for automated static analysis, container vulnerability scanning, and pod secret injection. Automated Software Bill of Materials (SBOM) generation and zero-day patch pipelines, authoring security control procedures and deploying Open Policy Agent (OPA) guardrails that directly enabled the company to achieve SOC 2 certification.

      - title: High-Throughput Distributed Systems, Vector Search & MLOps
        story: Designed, operated, and maintained high-availability, multi-region messaging, caching, and database infrastructure—including Apache Kafka (MSK, MirrorMaker, Connect), RabbitMQ, Aerospike, ClickHouse, and Vespa Cloud vector databases—delivering sub-50ms latency for ultra-high-throughput distributed ad-serving pipelines. Modernized data engineering and MLOps by replacing legacy Hadoop, Spark, Airflow, Django, Azkaban, and EMR setups with a unified cloud-native platform using Argo Workflows, Kubeflow, MLflow, and Feature Stores. Built automated model retraining pipelines triggered by metric drift detection and optimized Vespa schemas (services.xml) and multi-phase tensor ranking for real-time hybrid search (Vector + BM25).

      - title: FinOps Strategy, Cloud Optimization & Guardrailed AI Adoption
        story: Reduced company-wide cloud OpEx by millions of dollars—achieving massive annual savings on DataOps and MLOps workloads—by implementing dynamic autoscaling via Karpenter and Kubernetes Horizontal Pod Autoscaling (HPA) to optimize spot instance utilization and right-sizing. Consolidated cloud services by leveraging open-source components and pipeline automations in Argo Workflows and Kubernetes to drastically reduce Databricks compute costs, while migrating data engineering workloads off Airflow and Django to enable massive scale. Developed an automated Kubernetes resource inventory and reconciliation tool using AI workflows, labeling cluster resources to feed granular cost data into Kubecost dashboards. Evaluated and safely deployed AI-assisted development tools (Claude Code, Windsurf, GitHub Copilot, ChatGPT) by building centralized LLM proxy gateways equipped with automated PII sanitization to strictly enforce corporate data compliance.

      - title: Enterprise Observability & Incident Governance
        story: Streamlined a fragmented legacy monitoring stack (Prometheus, ELK/Graylog, Nagios, Catchpoint, Logstash, Filebeat, Telegraf, Graphite, Grafana) into a unified enterprise observability platform based on Datadog (APM Tracing & Logs). Implemented Linkerd service mesh in non-production environments for QE observability, contract testing shift-left, and distributed latency troubleshooting. Connected Datadog directly with PagerDuty for real-time incident routing and automated alert escalations, significantly reducing MTTR across mission-critical ad-serving pipelines.

