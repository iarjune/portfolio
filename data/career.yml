      - id: datacenter-decommissioning
        title: Full Datacenter Decommissioning & Hybrid Cloud Transition
        problem: >
          Maintaining two legacy physical data centers (East and West) housing 200+ physical Dell bare-metal servers and 600+ KVM virtual instances incurred heavy recurring CapEx/OpEx, hardware refresh bottlenecks, and rigid capacity constraints. Years of organic growth had created complex dependencies across multi-tenant backing services, bespoke provisioning tooling, and aging hardware—requiring a disciplined, zero-disruption exit strategy to avoid impacting live traffic.
        solution: >
          Orchestrated the end-to-end workload migration, hybrid network cutover, and complete physical decommissioning of both East and West data centers into a multi-region AWS environment (us-east-1 and us-west-1). By cataloging 1,000+ hardware and software components, draining traffic progressively over redundant AWS Direct Connect and Transit Gateway links, and executing compliant media sanitization and rack teardowns, the organization retired 100% of its physical footprint with zero service downtime.
        metrics:
          - "200+ Dell Hosts"
          - "600+ KVM Services"
          - "200+ Data Pipelines"
          - "100% Dockerized"
          - "2 Data Centers Decommissioned"
          - "2 AWS Regions Built"
          - "5 EKS Clusters"
          - "5 AWS Accounts"
          - "100% Availability"
        architecture: |
          graph TB
            subgraph OnPrem_East["On-Prem East Data Center (Decommissioned)"]
              EastHW["100+ Dell Hosts & KVM"]
              EastDX["Direct Connect Circuit (East)"]
              EastHW --- EastDX
            end

            subgraph OnPrem_West["On-Prem West Data Center (Decommissioned)"]
              WestHW["100+ Dell Hosts & KVM"]
              WestDX["Direct Connect Circuit (West)"]
              WestHW --- WestDX
            end

            subgraph Hybrid_Bridge["Hybrid Cutover & Drain Layer"]
              TGW["AWS Transit Gateway"]
              EastDX <-->|"Progressive Traffic Drain"| TGW
              WestDX <-->|"Progressive Traffic Drain"| TGW
            end

            subgraph AWS_East["AWS us-east-1 (Active)"]
              EKS_East["EKS Clusters (mgmt, test, prod)"]
              Data_East["Stateful & Managed Data Services"]
            end

            subgraph AWS_West["AWS us-west-1 (Active)"]
              EKS_West["EKS Clusters (mgmt, prod)"]
              Data_West["Stateful & Managed Data Services"]
            end

            subgraph Decom["Physical Exit & Retirement"]
              Sanitize["NIST Media Sanitization & Drive Destruction"]
              Teardown["Rack De-installation & Lease Termination"]
            end

            TGW --> AWS_East
            TGW --> AWS_West
            EastHW -.->|"Post-Drain Hardware Exit"| Sanitize
            WestHW -.->|"Post-Drain Hardware Exit"| Sanitize
            Sanitize --> Teardown
        deep_dive_sections:
          - title: Hardware Asset & Service Dependency Mapping
            content: |
              Before powering down any physical infrastructure, a comprehensive audit ensured no critical workloads or hidden dependencies were stranded:
              - **Full-Stack Inventory:** Cataloged over 1,000 hardware and software components across both East and West facilities, mapping dependencies between compute nodes, backing services, and multi-tenant backing services.
              - **Workload Classification:** Segmented legacy KVM instances and bare-metal processes into containerizable microservices for AWS EKS or cloud-native data services, eliminating redundant and orphaned virtual machines.
          - title: Hybrid Network Drain & Zero-Downtime Cutover
            content: |
              To prevent split-brain states or latency spikes during migration, both data centers were bridged to AWS before traffic was shifted:
              - **Dual-Region Backbone:** Leveraged redundant AWS Direct Connect circuits and Transit Gateway routing to maintain low-latency east-west and hybrid connectivity between on-prem data stores and AWS regions (`us-east-1` and `us-west-1`).
              - **Controlled Traffic & Circuit Decommission:** Progressively drained DNS, load balancer pools, and state replication streams to AWS, systematically powering down compute racks and terminating colocation circuits only after validation windows cleared.
          - title: Physical Decommissioning & Financial Exit
            content: |
              Once workloads were verified running exclusively on AWS, physical site exits were executed under strict security and compliance controls:
              - **Secure Media Sanitization:** Executed compliant data wiping, cryptographic erasure, and certified physical drive destruction across all retired Dell servers.
              - **Facility Exit & Cost Elimination:** Coordinated rack teardowns, hardware liquidation, and colocation lease terminations—eliminating recurring power, cooling, bandwidth, and hardware maintenance overhead.
