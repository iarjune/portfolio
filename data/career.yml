basics:
  name: "Ivan Arjune"
  label: "Lead Operations Engineer"
  location: "New York, NY"
  status: " Available to Lead your Ops Teams [DevOps | DevEx | SRE | Infra | Platform]"
  value_props:
    # Lead Ops Engineer and Mgmt
    persona1: |-
      <b>Great engineering organizations don't scale by adding more tools or people to solve operational problems. They scale by building platforms, automation, and engineering practices that make reliability, efficiency, and developer autonomy the default.</b>

      I bring a rare combination of deep systems engineering expertise, platform architecture, and hands-on engineering leadership. Throughout my career, I've worked across infrastructure, data platforms, SRE, DevOps, and MLOps, translating complex operational challenges into scalable engineering solutions. I've led the modernization of legacy infrastructure into cloud-native Kubernetes platforms, migrated 600+ microservices to AWS with zero downtime, and built self-service developer platforms that empowered more than 100 engineers to provision infrastructure and deploy applications independently.

      My approach extends beyond technology. I believe effective engineering leaders create clarity, remove friction, and enable engineers to do their best work. I've mentored 15+ engineers, aligned cross-functional teams around architectural direction, and driven engineering practices that improve delivery, observability, and operational resilience. By combining automation, intelligent resource management, and infrastructure modernization, I've also reduced company-wide cloud spending by 50%.

      Whether leading an engineering team or serving as a hands-on technical lead, I focus on outcomes that matter: faster delivery, resilient systems, lower operational overhead, and engineering teams that can scale without accumulating unnecessary complexity.

      I'm at my best where challenging technical problems meet opportunities to transform how engineering teams operate.
    # Infra & MLOPs Engineer
    persona2: |-
      <b>Production machine learning is only as effective as the infrastructure, data pipelines, and operational systems supporting it. Moving models from experimentation to production—and keeping them reliable, performant, and relevant over time—requires more than ML tooling. It requires a deep understanding of distributed systems, data engineering, infrastructure automation, and production operations.</b>

      I bring this systems-first perspective to MLOps, combining extensive experience in cloud-native architecture, Kubernetes orchestration, streaming data platforms, and GitOps to build the foundations that make machine learning operationally sustainable. I've engineered high-throughput data infrastructure and low-latency retrieval systems, supporting real-time workloads where performance, availability, and predictable scaling directly affect business outcomes.

      My focus is on eliminating the operational friction between model development and production. By integrating Argo Workflows, Argo Events, Kubeflow, MLflow, and feature stores, I've built automated DataOps and MLOps workflows that connect event-driven data processing, model retraining, and deployment. These Kubernetes-native architectures replaced legacy Hadoop and Airflow-based workflows with more automated, reproducible, and operationally consistent pipelines.

      Beyond orchestration, I engineer the production environment that ML systems depend on: scalable compute, reliable streaming, observability, security guardrails, and cost-efficient resource utilization. My experience operating complex systems like Kafka, Aerospike, ClickHouse, and Vespa bridges the gap between data-intensive ML workloads and the demands of real-time production systems.

      I build MLOps platforms that turn machine learning from a collection of experimental workflows into a repeatable, scalable, and production-ready engineering discipline

    # Platform Engineer
    persona3: |-
      <b>A successful internal developer platform does more than provision infrastructure—it transforms the way engineering organizations build, deploy, and operate software.</b> I approach platform engineering as product engineering, combining systems architecture, developer experience, and operational excellence to create platforms that make the secure, reliable path the easiest path.

      I've spent my career turning fragmented infrastructure and manual operational processes into cohesive, self-service engineering ecosystems. At adMarketplace, I helped transform a complex hybrid environment into a Kubernetes-native platform, building developer portals, automated provisioning workflows, and standardized delivery patterns that empowered 100+ engineers to operate infrastructure with greater autonomy. By bringing infrastructure, CI/CD, and GitOps together, I helped establish a consistent engineering experience across hundreds of microservices and modernize delivery pipelines spanning more than 900 repositories.

      My philosophy is to engineer away friction without engineering away control. I build golden paths that accelerate delivery while embedding security, policy enforcement, observability, and cost governance into the platform itself. Rather than treating these capabilities as separate operational responsibilities, I integrate them into the developer workflow—making reliability, compliance, and efficiency natural outcomes of good engineering.

      I measure platform success by its impact on the people and systems it serves: less cognitive overhead, faster feedback, greater developer autonomy, and lower operational costs. That approach has helped me drive company-wide cloud cost reductions of 50%, standardize enterprise observability, and introduce secure AI-assisted engineering workflows.

      I bring the perspective of both a systems engineer who understands what happens beneath the abstractions and a platform architect who understands why those abstractions matter to developers and the business.

      My goal is simple: build platforms that make engineering teams faster, systems more resilient, and operational complexity progressively less visible.

