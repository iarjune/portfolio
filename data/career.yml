  - id: "platform-engineering"
    title: "Platform Engineering & Developer Enablement"
    subtitle: "Internal developer platforms · Golden paths · Self-service · GitOps · CI/CD modernization"
    image: "platform-engineering.jpg"
    case_studies:
      - id: "idp-gitops"
        title: "Self-Service IDP & 100% ArgoCD GitOps"
        problem: "Engineers faced significant cognitive load, manual toil, and inconsistent configurations when provisioning cloud resources and deployment pipelines."
        solution: "Created a centralized Internal Developer Portal (IDP) with developer-managed 'golden path' templates. Orchestrated a Kubernetes-native, API-driven GitOps platform using the Argo suite, achieving 100% adoption across all engineering teams."
        metrics:
          - "100+ Engineers Empowered"
          - "100% GitOps Adoption"
          - "Full Developer Autonomy"
        architecture: |
          graph TD
            A[Developer] -->|IDP Portal| B(Golden Paths & Scaffolding)
            B --> C[GitHub Repository]
            C -->|Trigger| D[Argo Events & Workflows]
            C -->|Sync| E[Argo CD]
            E --> F[EKS Cluster]
        deep_dive_sections:
          - title: "Architecture Decisions & Trade-offs"
            content: |
              • Chose Backstage as the foundational developer portal to establish a unified catalog and self-service interface across polyglot microservice architectures.
              • Implemented Crossplane Composite Resource Definitions (XRDs) instead of ad-hoc Terraform PR workflows to enable declarative, API-driven cloud service provisioning.
              • Enforced GitOps reconciliation via Argo CD ApplicationSets across production and staging clusters to maintain state drift visibility.
          - title: "Implementation Strategy & Golden Paths"
            content: |
              • Standardized golden path templates covering CI/CD (GitHub Actions ARC), progressive delivery (Argo Rollouts), and automated secrets synchronization (External Secrets & Akeyless).
              • Integrated automated feedback collection directly into the IDP to continuously refine developer experience and reduce onboarding time.
        subsystems:
          - id: backstage-service-onboarding
            name: "Backstage Application Scaffolder"
            type: "Developer Portal"
            logoKey: "backstage"
            description: "Automated onboarding templates to scaffold new application repositories with production-ready defaults."
            techStackLogos: ["backstage", "github", "kubernetes"]
            gitopsPath: "templates/app-scaffolding"
            components:
              - name: "Service Onboarding Portal"
                spec: "Provisions a golden-path GitHub application repository and dedicated container registry."
              - name: "Language Runtimes"
                spec: "Supports Go, Java, Python, and Node.js runtimes with pre-configured health endpoints and metrics."

          - id: crossplane-infra-onboarding
            name: "Crossplane AWS Infrastructure Provisioner"
            type: "Infrastructure Control Plane"
            logoKey: "crossplane"
            description: "Self-service Crossplane templates enabling developers to declaratively attach AWS backing services."
            techStackLogos: ["crossplane", "terraform", "aws", "kubernetes"]
            components:
              - name: "Composite Resource Definitions"
                spec: "Exposes simplified architectural abstractions for backing databases and queues with zero manual IAM toil."
              - name: "Credential Injection"
                spec: "Automatically wires cloud resource connection strings into Kubernetes Secrets via External Secrets operator."

      - id: "cicd-migration"
        title: "Migration of 900+ Projects & Pipelines to GitHub Actions & Argo CD"
        problem: "Legacy CI/CD pipelines relying on Bitbucket, Jenkins, and Ansible suffered from slow build times, flaky execution, and maintenance bottlenecks."
        solution: "Modernized enterprise CI/CD by migrating 900+ repositories and pipelines from legacy Jenkins and Bitbucket systems to GitHub Actions ARC and K8s-native Argo Workflows and Argo CD."
        metrics:
          - "900+ Repositories Migrated"
          - "100% CI/CD Modernization"
          - "Significantly Reduced Build Times"
        architecture: |
          graph TD
            A[Legacy Bitbucket / Jenkins] -->|Pipeline Migration| B(GitHub Actions ARC)
            B --> C[Argo Workflows & Events]
            C --> D[K8s Build Runners]
            D --> E[Argo CD GitOps Deployment]
        deep_dive_sections:
          - title: "Pipeline Modernization & Reusable Workflows"
            content: |
              • Designed standardized GitHub reusable workflows for Go, Java, Python, and Node.js applications, establishing consistent build, test, and container packaging standards.
              • Replaced legacy monolithic Jenkins instances with elastic Kubernetes-backed GitHub Actions Runner Controller (ARC) pods scaling dynamically on EKS.
          - title: "GitOps Continuous Delivery Integration"
            content: |
              • Connected build outputs directly to GitOps repositories, updating image tag manifests automatically to trigger Argo CD synchronization.
              • Eliminated manual deployment scripts and established full traceability from code commit to production release.
        subsystems:
          - id: github-actions-arc
            name: "GitHub Actions Runner Controller (ARC)"
            type: "CI Orchestrator"
            logoKey: "githubactions"
            description: "Kubernetes-backed runner scale set for parallel container compilation, testing, and security scanning."
            techStackLogos: ["githubactions", "kubernetes", "docker"]
            components:
              - name: "Elastic Runner Scaling"
                spec: "Auto-scales build runners on EKS based on active workflow queue depth."
              - name: "Security Gateways"
                spec: "Integrates Snyk and SonarQube checks directly into the runner execution pipeline."

