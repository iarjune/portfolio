          graph TD
            A[5M ETL Transactions / Sec] --> B[Global Data Centers - 3 Regions]
            B --> C[10,000+ Dell Bare-Metal Servers]
            B --> D[4,000+ Xen Virtual Instances]
            E[Automated PXE / Kickstart / Puppet] --> C & D
