          - "600+ KVM Services"
          - "200+ Data Engineering Pipelines"
          - "100% Docker Containerized & Migrated to AWS EKS"
          - "Two Physical Datacenters (east and west) Decommissioned"
          - "100% Workload Availability During Transition"
          # TODO : Update diagram for east and west datacenters and regions
        architecture: |
          graph TD
            A[Physical Datacenters: 200+ Dell Hosts & 600+ VMs] -->|Cloud-Native Migration| B(Multi-Region AWS Environment)
            B --> C[EKS Container Workloads]
            B --> D[Managed AWS Data Services]
            E[Hardware Retirement & Decommissioning] --> F[Full Cloud-Native Operation]
        deep_dive_sections:
          - title: "Hardware Asset and Services Inventory Mapping"
            content: |
              • Cataloged over 1000 components, mapping dependencies between services, multi-teneant backing services and hardware.
              • Classified workloads into containerizable microservices for AWS EKS or managed data services, eliminating redundant legacy virtual machines.
          - title: "Built b"
          - title: "Physical Decommissioning & Financial Exit"
            content: |
              • Executed secure data sanitization, physical drive destruction protocols, and rack de-installation following enterprise compliance standards.
              • Eliminated datacenter lease expenses, power, and cooling overhead, realizing immediate capital and operational cost savings.
