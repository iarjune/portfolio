            name: "Physical Bare-Metal Fleet"
            type: "Data Center Infrastructure"
            logoKey: "linux"
            description: "Legacy physical server inventory managed via The Foreman and Puppet before cloud migration."
            techStackLogos: ["linux", "puppet", "dell"]
