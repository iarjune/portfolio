basics:
  name: "Ivan Arjune"
  label: "Lead Operations Engineer"
  location: "New York, NY"
  status: " Available to Lead your Ops Teams [DevOps | DevEx | SRE | Infra | Platform]"
  value_props:
# Lead Ops Engineer
    persona1: |-
      As a <b>strategic engineering leader</b> across all operations disciplines, I scale high-performing teams to modernize multi-account cloud, hybrid Kubernetes, and DevSecOps ecosystems. By bridging core infrastructure with developer-centric workflows, I drive <b>50% cloud cost reductions</b>, zero-downtime microservice migrations, and enterprise <b>SOC 2 compliance</b>. From self-service Internal Developer Portals (IDPs) and GitOps pipelines to low-latency MLOps and guardrailed AI platforms, I align cross-functional engineering organizations to maximize <b>velocity, security, and operational excellence</b>.<br />
      <b>Strategic Pillars:</b>
      • <b>Enterprise Cloud & Kubernetes Modernization:</b> Spearheaded multi-account AWS (EKS) and hybrid private cloud architectures. Executed zero-downtime migrations of <b>600+ microservices</b> and <b>900+ repositories</b> from legacy systems to Kubernetes-native GitOps (ArgoCD, Crossplane)<br />
      • <b>Developer Experience & Self-Service Automation:</b> Abstracted complex topologies into intuitive Internal Developer Portals (IDPs) with standardized golden path templates—empowering <b>hundreds of product engineers</b> with autonomous infrastructure provisioning while significantly reducing cognitive load<br />
      • <b>Low-Latency MLOps & Production AI Platforms:</b> Engineered high-throughput data streaming (Kafka, ClickHouse) and low-latency search infrastructure (Vespa Cloud, <b>sub-50ms search at scale</b>). Built automated Kubeflow/MLflow continuous retraining pipelines and enforced AI safety via centralized LLM proxy gateways and PII sanitization<br />
      • <b>FinOps, DevSecOps & Enterprise Governance:</b> Delivered a <b>50% reduction in cloud infrastructure spend</b> using Karpenter autoscaling, spot instance strategies, and Kubecost allocation. Embedded Snyk, SonarQube, and Artifactory into CI/CD pipelines to achieve <b>SOC 2 audit compliance</b> and automated SBOM generation

#As a strategic engineering leader across all operations disciplines, I scale high-performing engineering teams to modernize multi-account cloud, hybrid Kubernetes, and DevSecOps ecosystems. By bridging infrastructure foundations with developer-centric workflows, I have driven 50% cloud cost reductions, zero-downtime microservice migrations, and enterprise SOC 2 compliance. From building self-service Internal Developer Portals (IDPs) and GitOps pipelines to deploying low-latency MLOps and guardrailed AI platforms, I align cross-functional engineering organizations to maximize velocity, security, and operational excellence. 
# Infra/MLOps Engineer
    persona2: |-
      At its core, a highly functional MLOps platform is a specialized distributed system. The challenges of deploying, scaling, and maintaining machine learning models in production are fundamentally infrastructure and operations challenges. My extensive background in systems engineering, Kubernetes orchestration, and full-stack observability provides the precise technical foundation required to build and scale ideal ML operating systems.
      
      An ideal ML platform relies on seamless automation to move models from training to production. By leveraging my deep expertise in declarative Infrastructure as Code and GitOps, I design environments that eliminate operational bottlenecks. I have a proven track record of architecting and scaling robust CI/CD systems and MLOps pipelines using Argo (CD, Workflows, Events), Kubeflow, and MLflow. By modernizing data and ML operations—transitioning them from legacy tools like Airflow and Hadoop to Kubernetes-native GitOps pipelines—I have successfully implemented the continuous retraining workflows necessary for rapid ML model delivery.
      
      Machine learning requires massive, high-speed data ingestion and ultra-fast retrieval. My background in engineering complex private and public cloud topologies allows me to build the underlying architecture that ML models depend on. I have built and managed the critical infrastructure for data streaming and feature retrieval, including Kafka, ClickHouse, Redis, Aerospike, and dedicated Feature Stores. Furthermore, I have deployed and operated production-grade vector search and retrieval infrastructure utilizing Vespa Cloud, optimizing multi-phase tensor ranking and real-time streaming to achieve low-latency (sub-50ms) hybrid search at massive scale.
# Platform Engineer
    persona3: |-
      Platform Engineering is not just about managing infrastructure—it is about treating the platform as an internal product that maximizes developer velocity while maintaining strict operational guardrails. By leveraging 15+ years of systems architecture and leadership, I abstract complex hybrid environments into self-service developer portals that eliminate toil, lower cognitive load, and accelerate feedback loops from code commit to production.

      <b>Key Value Drivers:</b>
      • <b>Self-Service IDPs & "Golden Path" Engineering:</b> Abstracted complex multi-account AWS EKS and hybrid infrastructure into intuitive Internal Developer Portals (IDPs). Delivered boilerplate service scaffolding and standardized golden path templates for 600+ microservices, empowering hundreds of engineers with self-service onboarding and autonomous provisioning.   <br />
      • <b>GitOps-Driven SDLC Acceleration:</b> Spearheaded company-wide migrations of 900+ repositories and legacy CI/CD pipelines (Jenkins/Bitbucket) to Kubernetes-native GitOps architectures using GitHub Actions, ArgoCD, Argo Workflows, and Crossplane—eliminating operational bottlenecks and drastically boosting deployment frequency.   <br />
      • <b>Full-Stack Observability & DORA Metrics:</b> Standardized enterprise monitoring by migrating legacy systems to Datadog APM, OpenTelemetry, and PagerDuty. Partnered with SRE teams to track core DORA metrics (MTTR, build times, change failure rates), embedding real-time feedback loops directly into developer workflows.   <br />
      • <b>Enterprise FinOps, AI Tooling & DevSecOps Guardrails:</b> Delivered a 50% cloud cost reduction ($600K+ annual savings) using Karpenter autoscaling, spot strategies, and Kubecost allocation. Pioneered the safe enterprise rollout of AI-assisted coding tools (Claude Code, GitHub Copilot) using centralized LLM proxy gateways, PII sanitization, and automated security guardrails (Snyk, SonarQube, SOC 2 compliance).

