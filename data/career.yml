        deep_dive_sections:
          - title: "SDLC"
            image: "sdlc.jpg"

          - title: "GitOps Operating Model & Declarative State Management"
            content: |
              Established Git as the authoritative source of truth for desired state, using Kubernetes’ continuous reconciliation engines.
              - GitOps mono-repo centralized application and infrastructure configuration.
              - Service Onboarding standardized K8s manifests and environment overlays. 
              - Argo CD reconciled for Infrastructure resources and Kubernetes workloads.
              - Prod and Non-Prod Argo CD clusters for reduced blast radius and independent operations.
              - Clean separation between CI artifact building and CD execution.
              - Application env specific configurations, eg database connections, are part of the CD code base
              - Kustomize ConfigGenerator injects env vars configmaps during deployment
            links:
              - label: "GitOps Repo"
                url: "https://github.com/devops-end2end/gitops"

          - title: "GitOps Auto-Promotion"
            content: |
              Designed a Git-driven release promotion pipeline that made successful end-to-end validation a prerequisite for production deployment. Rather than having CI/CD directly execute Kubernetes deployments, the pipeline updates the desired state in Git and relies on Argo CD to reconcile the environment.
              - CD Pipeline automated updates to the image reference in the Kustomize TEST overlay.
              - Argo CD synchronization manually triggered.
              - Implemented deployment health monitoring, allowing the pipeline to wait for the environment creation.
              - Executed end-to-end functional validation against the deployed application.
              - Removed the test environment following validation.
              - Updated the production Kustomize overlay only after successful validation.
              - Production validation and rollback are functions performed by the Argo Rollouts system
            links:
              - label: "CICD Workflow"
                url: "https://github.com/devops-end2end/templates/blob/main/service/python/skeleton/.github/workflows/cicd.yaml"
              - label: "Deployment Workflow"
                url: "https://github.com/devops-end2end/github-workflows/blob/main/.github/workflows/argocd-deployment.yaml"
              - label: "Kustomize Overlays for an API app"
                url: "https://github.com/devops-end2end/templates/tree/main/deployment/api/skeleton"

          - title: "Regional / Multi-Cluster GitOps Deployments"
            content: |
              To manage multi-cluster deployments, like east and west, implemented the clusterGenerator feature in Argo CD ApplicationSets.  This feature dynamically discovered EKS clusters from the ArgoCD system and created independent East/West production deployments through a unified template.  This was the scalable foundation for onboarding additional regions.
              - Registered and labeled production EKS clusters in Argo CD.
              - Templated ApplicationSets implemented the cluster generator feature.  This leverages the cluster labels to dynamically generate separate Argo CD Applications for East and West production clusters.
              - Used region specific Kustomize overlays to manage env specific application configuration.
              - CD pipeline independently synchronized and reconciled each regional application.
            links:
              - label: "Prod ApplicationSet"
                url: "https://github.com/devops-end2end/templates/blob/main/deployment/api/skeleton/release-configs/prod.yaml"

          - title: "Progressive Delivery & Automated Release Safety"
            content: |
              Introduced Argo Rollouts as the progressive delivery engine, replacing conventional deployment strategies with controlled canary releases, metrics-driven analysis, and automated promotion or rollback.  The objective was to make production releases controlled, observable, and independently managed by the platform rather than dependent on individual engineers executing privileged deployment operations.
              - Integrated Argo Rollouts into production application delivery.
              - Implemented canary deployment strategies.
              - Introduced controlled traffic shaping during application releases.
              - Integrated metrics analysis into rollout progression.
              - Established automated promotion criteria based on rollout analysis.
              - Enabled automated rollback when release health criteria were not satisfied.
            links:
              - label: "Argo Rollouts"
                url: "https://github.com/devops-end2end/templates/blob/main/deployment/argo-rollout/skeleton/base/rollout.yaml"

          - title: "Democratize Infrastructure with Crossplane"
            content: |
              The cross-team collaboration within the Terraform mono-repo, which I introduced, resulted in increased cognitive load and complexity for development teams. The organization needed a consistent API for infrastructure management, one which aligned with the cloud provisioning with declarative reconciliation architecture being introduced for application delivery.

              I adopted Crossplane to extend Kubernetes-native declarative management beyond application workloads into cloud infrastructure provisioning.  The decision was to use Kubernetes APIs as the interface for defining and managing infrastructure resources, allowing infrastructure and application lifecycles to operate under a consistent reconciliation model.
              - Introduced Crossplane as the infrastructure control plane.
              - Created Crossplane manifest templates for the services onboarding system.
              - Defined Composite Resource Definitions (XRDs) to establish infrastructure APIs.
              - Implemented Compositions to translate higher-level infrastructure abstractions into managed resources.
              - Integrated AWS Providers for cloud resource management.
              - Established declarative provisioning workflows for AWS services, including RDS, S3, and SQS.
              - Integrated infrastructure claims and definitions into the broader GitOps operating model.
              - Centralized infrastructure desired state in version-controlled configuration.

          - title: "Deployment Governance, Least-Privilege Access & Operational Security"
            content: |
              Shifted deployment authority from individual engineers to centrally managed GitOps controllers and progressive delivery automation. The architecture established a separation between requesting or authorizing changes and executing privileged operations. Engineers interact with version-controlled desired state, while Argo CD and Argo Rollouts perform the actual deployment and rollout operations through their configured service identities and permissions, backed by SCM-managed service-level access controls and user-level authentication and authorization (AA) across GitOps repositories, Argo CD, and AWS.
              - Established Git as the controlled interface for declaring application deployment changes.
              - The SCM provided user-level authentication and authorization (AA) and auditing to privileged repositories.
              - The SCM repositories, or service, level secrets provided permissions to govern access and management across the GitOps repository, Argo CD, and AWS resources.
              - Delegated Kubernetes synchronization and deployment execution to Argo CD.
              - Delegated progressive delivery and rollback execution to Argo Rollouts.
              - Delegated Infrastructure provisioning to Crossplane.
              - Removed the operational requirement for engineers to directly execute privileged Kubernetes deployment commands.
              - Established Git-based change history and traceability for deployment configuration.

