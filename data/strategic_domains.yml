              - name: "ApplicationSets"
                spec: "Dynamically generate independent East and West production Argo CD Applications using registered cluster metadata."
              - name: "Cluster Registration"
                spec: "Registers and labels Kubernetes clusters so Argo CD can target the appropriate deployment environments."
              - name: "Continuous Reconciliation"
                spec: "Detects Git changes and synchronizes Kubernetes resources, maintaining alignment between declared and deployed state."

          - id: progressive-delivery
