          - id: hybrid-cutover-backbone
            name: Hybrid Cutover & Traffic Drain Backbone
            type: Network & Migration Infrastructure
            logoKey: aws
            description: High-throughput hybrid networking connecting East and West data centers to AWS us-east-1 and us-west-1 during phased workload migration.
            techStackLogos:
              - aws
