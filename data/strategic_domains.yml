  - id: "cloud-transformation"
    title: "Cloud Transformation"
    subtitle: "Cloud migrations · Data center exits · Multi-account architecture · Infrastructure modernization"
    image: "cloud-transformation.jpg"
    case_studies:
      - id: eks-multi-region-migration
        title: Zero-Downtime Multi-Region AWS EKS Migration for Sub-50ms Ad Platform
        problem: "Operating a sub-50ms real-time ad platform across fragmented bare-metal, KVM, and standalone Docker infrastructure in two on-premise data centers introduced critical scalability limits, slow hardware provisioning, and high deployment risk. A sprawling footprint of 600+ microservices, 200+ data pipelines, and untracked legacy cron jobs suffered from environment drift and heavy operational overhead, making multi-region resilience and rapid iteration increasingly difficult."
        solution: "Architected a multi-region, multi-account AWS foundation (us-east-1 featuring mgmt, test, and prod accounts, and us-west-1 featuring mgmt and prod accounts) anchored by 5 EKS clusters, Direct Connect, and Transit Gateway, and led a phased, zero-downtime migration of the entire platform. By first containerizing legacy workloads onto an interim on-prem Docker platform and upskilling engineering teams through hands-on workshops, I enabled a smooth, incremental cutover powered by Argo CD and Crossplane—moving 600+ services and stateful data stores (Kafka, Aerospike, ClickHouse, Redis, MySQL, RabbitMQ, and HDFS) with zero impact on live ad traffic. To balance migration speed with long-term standardization, I pragmatically transitioned data engineering workloads to AWS Managed Workflows for Apache Airflow (MWAA) first before consolidating them onto Argo Workflows, leaving the entire organization on a unified, cloud-native Kubernetes stack."
        metrics:
          - "600+ microservices"
          - "Zero downtime"
          - "200+ data engineering pipelines"
          - "5 EKS clusters"
          - "2 Regions and 3 account structure"
          - "7 stateful distributed data technologies"
        architecture: |
          graph TB
            subgraph OnPrem["On-Premises Data Centers (East & West)"]
              Legacy["Bare-Metal & KVM Instances"]
              InterimDocker["Interim On-Prem Docker Platform"]
              Legacy -->|"Phase 1: Containerize"| InterimDocker
            end

            subgraph Network["Hybrid Connectivity"]
              DX["AWS Direct Connect"]
              TGW["AWS Transit Gateway"]
              InterimDocker <--> DX <--> TGW
            end

            subgraph AWS_East["AWS us-east-1"]
              MgmtE["mgmt Account (EKS)"]
              TestE["test Account (EKS)"]
              ProdE["prod Account (EKS)"]
            end

            subgraph AWS_West["AWS us-west-1"]
              MgmtW["mgmt Account (EKS)"]
              ProdW["prod Account (EKS)"]
            end

            subgraph Platform["GitOps & Orchestration Layer"]
              ArgoCD["Argo CD (GitOps Delivery)"]
              Crossplane["Crossplane (Infra Provisioning)"]
              MWAA["AWS MWAA (Interim Airflow)"]
              ArgoWF["Argo Workflows (Target K8s Native)"]
            end

            TGW <--> AWS_East
            TGW <--> AWS_West
            Platform --> AWS_East
            Platform --> AWS_West
            MWAA -.->|"Phase 3: Final Consolidation"| ArgoWF
        deep_dive_sections:
          - title: Phased Execution & Risk Mitigation Strategy
            content: |
              To prevent disruption to high-throughput, low-latency ad serving, the migration was decoupled into incremental, verifiable phases rather than a single cutover:
              - **Discovery & Dependency Mapping:** Audited both on-prem data centers to uncover undocumented workloads, legacy cron jobs, and service-to-service dependencies, ranking services by blast radius and business criticality.
              - **Interim On-Prem Containerization:** Built standardized CI/CD container build pipelines, deployment mechanics, and an on-prem Docker hosting tier. This isolated application containerization risks from cloud networking and infrastructure changes.
              - **Engineering Enablement:** Conducted hands-on workshops to train product and data teams on Docker workflows, health checks, and Kubernetes deployment patterns before AWS cutover.
              - **Incremental Traffic Shifting:** Leveraged Direct Connect and Transit Gateway for low-latency hybrid state synchronization while progressively shifting production workloads via Argo CD.
          - title: Data Engineering Orchestration Trade-off (MWAA to Argo Workflows)
            content: |
              Migrating 200+ data pipelines alongside 600+ real-time microservices risked overloading data engineers with simultaneous paradigm shifts:
